# CI-2. Прогон того, что уже написано и уже умеет краснеть правильно.
#
# Зачем это первым блоком захода 6, раньше канона
# ───────────────────────────────────────────────
# Стоит два часа и начинает защищать всё остальное с первого же коммита.
# А блок A двигает пятьдесят файлов — делать это без прогона на пуше значит
# потерять единственный дешёвый сторож ровно тогда, когда он нужнее всего.
#
# Что этот прогон ловит, а стенд — нет
# ────────────────────────────────────
# Правка в graph_writer может разъехаться с запросом сервера. Такое было
# четыре раза (PERF-4, FIX-14, FIX-16, FIX-17), и каждый раз это находили
# на стенде — то есть днями позже. tests_graph_contract.py ловит это
# мгновенно, написан давно и до сих пор запускался руками.
#
# Ни Docker, ни стенда, ни выгрузки 1С здесь не нужно: все 937 тестов
# работают на голом Python за 11 секунд.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Единственная зависимость прогона. Без неё evals/runner/tests.py не
      # запускается, --strict это честно считает провалом, и CI краснеет по
      # причине «нечем проверить», а не «сломано».
      #
      # Версия закреплена той же, что в 1c-mcp-suite/requirements.lock.txt.
      # Не для красоты: SDK переименовал streamablehttp_client между
      # версиями, и раннер, собранный на другой, падает на импорте — то есть
      # CI краснел бы на чужом релизе, а не на нашей правке.
      #
      # Расхождение этой строки с лок-файлом ловит
      # scripts/tests_lockfile_pairs.py. Пятый список, который нельзя
      # забыть обновить руками, заводить не будем.
      - name: MCP SDK для eval-runner
        run: python -m pip install --disable-pip-version-check "mcp[cli]==1.29.0"

      # A-5: набор, который НЕ запустился, считается провалом. Без --strict
      # отсутствующая зависимость выглядит как зелёный прогон с примечанием
      # — то есть как раз тем молчаливым отказом, против которого построен
      # весь заход 5.
      - name: Тесты
        run: python scripts/run_all_tests.py --strict

      # Рабочий каталог, без истории. Почему именно так — длинный
      # комментарий у ключа в scripts/check_publish.py; коротко: историю
      # сегодняшний коммит починить не может, и красный навсегда CI
      # перестают читать вместе с 937 тестами рядом.
      - name: Не добавили ли секрет
        run: python scripts/check_publish.py --worktree-only

  # Полная проверка, включая историю гита. Отдельной задачей и только по
  # кнопке: её провал — повод принимать решение (filter-repo, новый
  # репозиторий), а не чинить коммит.
  publish-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # история целиком — ради неё всё и затевается

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Готов ли репозиторий к публикации
        run: python scripts/check_publish.py
